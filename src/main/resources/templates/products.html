<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="layout1"
>
<head>
    <meta charset="UTF-8">
    <title>Products</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.3.6/css/bootstrap.min.css">
    <script src="/webjars/bootstrap/5.3.6/js/bootstrap.bundle.js"></script>
</head>
<body>
  <div class="p-3" layout:fragment="content1">
      <!-- Recherche -->
      <form method="get" th:action="@{/user/search}" class="d-flex gap-2">
          <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                 placeholder="Search by name...">
          <button type="submit" class="btn btn-outline-primary">Search</button>
          <a class="btn btn-outline-secondary" th:href="@{/user/index}">Reset</a>
      </form>

    <div class="p-3" sec:authorize="hasRole('ADMIN')">
        <a class="btn btn-primary" th:href="@{/admin/newProduct}">New Product</a>
    </div>
    <table class="table">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
        </thead>
        <tbody>
            <tr th:each="p:${productList}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form method="post" th:action="@{/admin/delete(id=${p.id})}">
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
  </div>
</body>
</html>
