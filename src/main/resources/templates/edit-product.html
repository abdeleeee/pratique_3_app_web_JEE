<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout1"
>
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/5.3.6/css/bootstrap.min.css">
</head>
<body>
<div class="p-3" layout:fragment="content1">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-header bg-warning text-center py-3 rounded-top-4">
                    <h4 class="mb-0 fw-bold">Edit Product</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" th:action="@{/admin/updateProduct}" th:object="${product}">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Name:</label>
                            <input type="text" class="form-control" th:field="*{name}">
                            <div class="text-danger" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price:</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{price}">
                            <div class="text-danger" th:errors="*{price}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantity:</label>
                            <input type="number" class="form-control" th:field="*{quantity}">
                            <div class="text-danger" th:errors="*{quantity}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">Update</button>
                            <a class="btn btn-outline-secondary" th:href="@{/user/index}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
